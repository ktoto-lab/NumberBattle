
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Number Battle</title>

    <link rel="stylesheet" href="css_battle.css">
</head>

<body>

    <div class="layout">

        <!-- Ліва фоторамка -->
        <div class="photo-frame left-frame">
            <img src="cocktail2.png" alt="Ліве фото">
        </div>

        <!-- Ігрове поле -->
        <div class="game">

            <h1>Bar Battle</h1>
            <p class="subtitle">PLAYER VS BARTENDER</p>

            <div class="players">

                <!-- Гравець -->
                <div class="player">
                    <h2 id="userName">Гравець</h2>
                    <div class="number" id="userNumber">?</div>
                    <div class="score">
                        SCORE: <span id="userScore">0</span>
                    </div>
                </div>

                <!-- Бармен -->
                <div class="player bartender"
                    style="
                    background-image:
                    linear-gradient(
                        rgba(8, 8, 19, 0.70),
                        rgba(8, 8, 19, 0.70)
                    ),
                    url('bartender.png');
                    background-size: cover;
                    background-position: center;
                    ">

                    <h2>Bartender</h2>

                    <div class="number" id="computerNumber">?</div>

                    <div class="score">
                        SCORE: <span id="computerScore">0</span>
                    </div>

                </div>

            </div>

            <p id="result">READY TO PLAY?</p>

            <button id="playButton">Start Battle</button>

            <div class="footer">
                FIRST TO 3 WINS! GET A CHANCE TO WIN FREE DRINK! GOOD LUCK
            </div>

        </div>

        <!-- Права фоторамка -->
        <div class="photo-frame right-frame">
            <img src="cocktail3.png" alt="Праве фото">
        </div>

    </div>

    <script>

        // Отримання імені користувача
        let userName = "";

        while (userName.trim() === "") {
            userName = prompt("Введіть своє ім'я:");

            if (userName === null) {
                userName = "Гравець";
                break;
            }
        }

        // Отримання HTML-елементів
        const userNameElement = document.querySelector("#userName");
        const userNumberElement = document.querySelector("#userNumber");
        const computerNumberElement = document.querySelector("#computerNumber");
        const userScoreElement = document.querySelector("#userScore");
        const computerScoreElement = document.querySelector("#computerScore");
        const resultElement = document.querySelector("#result");
        const playButton = document.querySelector("#playButton");

        // Встановлення імені користувача
        userNameElement.textContent = userName;

        // Початкові значення рахунку
        let userScore = 0;
        let computerScore = 0;

        // Обробник натискання кнопки
        playButton.addEventListener("click", () => {

            // Генерація випадкових чисел
            let userNumber = Math.floor(Math.random() * 10) + 1;
            let computerNumber = Math.floor(Math.random() * 10) + 1;

            // Відображення чисел
            userNumberElement.textContent = userNumber;
            computerNumberElement.textContent = computerNumber;

            // Порівняння чисел
            if (userNumber > computerNumber) {
                userScore++;
                resultElement.textContent = userName + " WINS THE ROUND!";
            }
            else if (computerNumber > userNumber) {
                computerScore++;
                resultElement.textContent = "BARTENDER WINS THE ROUND!";
            }
            else {
                resultElement.textContent = "DRAW! TRY AGAIN!";
            }

            // Оновлення рахунку
            userScoreElement.textContent = userScore;
            computerScoreElement.textContent = computerScore;

            // Перевірка завершення гри
            if (userScore === 3 || computerScore === 3) {

                if (userScore === 3) {
                    resultElement.textContent = userName + " WINS THE BATTLE AND GETS A FREE DRINK!";
                }
                else {
                    resultElement.textContent = "BARTENDER WINS THE BATTLE! PLAYER PAYS FOR DRINK!";
                }

                playButton.disabled = true;
            }
        });

    </script>

</body>
</html>
